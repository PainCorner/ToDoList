<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスクボード</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="javascript/app.js" defer></script>
</head>

<body>
    <header class="main-header">
        <h1 class="main-header__heading">タスクボード</h1>
    </header>
    <main class="main-body">
        <div class="task-actions">
            <button class="task-actions__btn task-actions__btn--add" type="button">＋タスク追加</button>
        </div>
        <div class="task-board">
            <section class="card card--todo">
                <header class="card__header">
                    <h2 class="card__title">開始前</h2>
                </header>
                <div class="card__content">
                    <ul class="card__list">
                        <li class="card__item card__item--todo">
                            <label class="card__label">
                                <input class="card__checkbox" type="checkbox">
                                <span class="card__text">開始前</span>
                            </label>
                            <button type="button" class="card__del-btn">削除</button>
                        </li>
                    </ul>
                </div>
            </section>
            <section class="card card--doing">
                <header class="card__header">
                    <h2 class="card__title">進行中</h2>
                </header>
                <div class="card__content">
                    <ul class="card__list">
                        <li class="card__item">
                            <label class="card__label">
                                <input class="card__checkbox" type="checkbox">
                                <span class="card__text">進行中</span>
                            </label>
                            <button type="button" class="card__del-btn">削除</button>
                        </li>
                    </ul>
                </div>
            </section>
            <section class="card card--done">
                <header class="card__header">
                    <h2 class="card__title">完了</h2>
                </header>
                <div class="card__content">
                    <ul class="card__list">
                        <li class="card__item">
                            <label class="card__label">
                                <input class="card__checkbox" type="checkbox">
                                <span class="card__text">完了</span>
                            </label>
                            <button type="button" class="card__del-btn">削除</button>
                        </li>
                    </ul>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
